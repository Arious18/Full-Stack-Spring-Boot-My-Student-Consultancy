spring.application.name=backend

# MongoDB Configuration
## For local MongoDB - uncomment these lines and comment Atlas URI
#spring.data.mongodb.host=localhost
#spring.data.mongodb.port=27017

# For MongoDB Atlas - uncomment this line and comment local config above
 spring.data.mongodb.uri=    <your mongo  db atlas url  >> 
 spring.data.mongodb.database=MyData

# Server Configuration
server.port=8080
spring.profiles.active=default
spring.main.allow-circular-references=true

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin

# Add these for better debugging
logging.level.tmtalyp.backend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# Cloudflare R2 Configuration
cloudflare.r2.endpoint= YOUR CLOUDFLAE R2 DATABSE
cloudflare.r2.bucket=my-data
cloudflare.r2.accessKey=ACCESS KEY
cloudflare.r2.secretKey=SECRET KEY 

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# JWT Configuration
jwt.secret=yourVeryLongAndSecureSecretKeyHereAtLeast32Characters
jwt.expiration=86400000

# MongoDB Connection Pool Settings (for better performance)
spring.data.mongodb.auto-index-creation=true
